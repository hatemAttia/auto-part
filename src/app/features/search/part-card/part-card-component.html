<div class="card">
  <div class="card-header">
    <img [src]="part.imageUrl" [alt]="part.name" class="part-image" />
  </div>
  <div class="card-body">
    <img class="equivalent-brand-logo" src="/assets/img/logo.png" alt="" />
    <h2>{{ part.name }}</h2>
    <p>Réf: {{ part.partNumber }}</p>
    <div class="part-purchase-container">
      <app-add-to-cart
        [stock]="part.stock"
        [price]="part.price"
        [isAvailable]="part.stock > 0"
        priceSize="small"
        availabilitySize="small"
        [showLabel]="false"
        availabilityMode="text"
        availabilitySize="small"
        (addToCart)="addToCart.emit(part)"
      >
      </app-add-to-cart>
      <button pButton label="Voir détails" class="details-button" (click)="viewDetails.emit(part)"></button>
    </div>
  </div>
</div>

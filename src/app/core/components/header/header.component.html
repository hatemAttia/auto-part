<header class="header">
  <div class="container">
    <div class="header-content">
      <div class="logo-nav-links">
        <div class="logo" [routerLink]="isLoggedIn ? '/search' : '/login'">
          <img src="assets/img/logo-t.png" alt="">
        </div>
        <ul class="nav-links">
          <li>
            <a>Commandes</a>
          </li>
          <li>
            <a>Factures</a>
          </li>
          <li>
            <a>Bons de livraison</a>
          </li>
          <li>
            <a>Historique</a>
          </li>
        </ul>
      </div>

      <div class="user-actions">
        <div class="user-container">
          <i class="pi pi-user"></i>
          <div class="user">
            <span>Nom d'utilisateur</span>
            <span class="logout"> Déconnexion </span>
          </div>
        </div>
      </div>



      <div class="search-bar-container">
        <div class="button history-button">
          <i class="pi pi-history"></i>
        </div>

        <div class="outer-search-container">
          <div class="search-container">
            <input type="text" placeholder="Entrer la référence ou la piéce" />
          </div>
        </div>

        <div class="button search-button">
          <i class="pi pi-search"></i>
        </div>
      </div>

<div class="part-purchase-container">
  <div class="part-availibility-section" [ngClass]="'availability-' + availabilitySize">
    <!-- <span class="availability-dot" [ngClass]="getStockStatusClass()"></span> -->
    <!-- <span class="availability-text">{{ getStockStatusText() }}</span> -->
    <p-tag *ngIf="stock > 0" severity="success" value="En stock"></p-tag>
    <p-tag *ngIf="stock <= 10 && stock > 0" severity="warning" value="Low Stock"></p-tag>
    <p-tag *ngIf="stock === 0" severity="danger" value="Out of Stock"></p-tag>
  </div>
  <hr />
  <div class="part-price-section">
    <span
      class="part-price"
      [ngClass]="'price-' + priceSize"
      [style]="{
        color: stock === 0 ? '#35343D28' : ''
      }"
      >{{ formatPrice(price) }}</span
    >
  </div>
  <div class="part-quantity-purchase">
    <div class="part-quantity">
      <!-- <p-inputNumber [(ngModel)]="quantity" [min]="0" [max]="stock" [showButtons]="true" inputId="stacked" mode="decimal"
        currency="USD" /> -->
      <p-inputNumber
        [(ngModel)]="quantity"
        [showButtons]="true"
        buttonLayout="horizontal"
        [min]="1"
        [max]="stock"
        [inputStyle]="{ width: '80px' }"
        [disabled]="stock === 0"
        styleClass="p-inputnumber-sm"
      >
        <ng-template pTemplate="decrementbuttonicon">
          <i class="pi pi-minus" style="color: black; font-size: 12px; margin: 5px"></i>
        </ng-template>
        <ng-template pTemplate="incrementbuttonicon">
          <i class="pi pi-plus" style="color: black; font-size: 13px"></i>
        </ng-template>
      </p-inputNumber>
    </div>
    <button
      pButton
      [label]="showLabel ? 'Commander' : ''"
      [icon]="showIcon ? 'pi pi-shopping-cart' : ''"
      class="p-button-primary cart-button"
      appButtonResize
      [disabled]="!isAvailable || stock === 0"
      (click)="onAddQuantity()"
    ></button>
  </div>
</div>
